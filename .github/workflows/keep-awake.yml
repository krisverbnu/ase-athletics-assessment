# Keeps the free Render API awake while the app is being reviewed.
# Render's free plan sleeps after 15 minutes without traffic, which makes the
# next visitor wait ~50 seconds. This pings the health check every 5 minutes
# (GitHub sometimes runs scheduled jobs a few minutes late, so 5 leaves margin).
# Turn it off afterwards: Actions tab > Keep API awake > ... > Disable workflow.
name: Keep API awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # adds a "Run workflow" button for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API health check
        run: curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 15 https://ase-athletics-assessment.onrender.com/api/health